<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<base href="customer/">
	<title>Your Business | Cart</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
	<script>document.documentElement.lang=localStorage.getItem('lang')==='ar'?'ar':'en';document.documentElement.dir=document.documentElement.lang==='ar'?'rtl':'ltr';if(localStorage.getItem('siteTheme')==='theme-dark')document.documentElement.classList.add('theme-dark');</script>
	<link rel="stylesheet" href="css/customer.css?v=19">
</head>
<body class="cart-page">
	<header class="cart-header">
		<div class="cart-header-top">
			<a class="customer-brand" href="index.html" aria-label="Back to catalog" data-i18n-aria="backCatalog">
				<span class="customer-brand-mark">BL</span>
				<span data-restaurant-name>Your Business</span>
			</a>
			<a class="cart-back-link" href="index.html"><span aria-hidden="true">&#8592;</span><span data-i18n="back">Back</span></a>
		</div>
		<div class="cart-page-heading">
			<p class="eyebrow" data-i18n="yourOrder">YOUR ORDER</p>
			<h1 id="cart-title" data-i18n="yourCart">Your Cart</h1>
			<p class="cart-page-subtitle" data-i18n="reviewCart">Review your items before checkout.</p>
		</div>
	</header>
	<main class="cart-main">
		<section class="cart-shell" aria-label="Your cart">
			<div class="cart-section-heading">
				<h2 data-i18n="orderItems">Order items</h2>
				<span id="cart-items-count" aria-live="polite"></span>
			</div>
			<div id="cart" aria-live="polite"></div>
			<div class="table-number-field">
				<label for="table-number"><span id="location-number-label">Table number</span> <span aria-hidden="true">*</span></label>
				<input id="table-number" name="tableNumber" type="number" min="1" max="20" step="1" inputmode="numeric" autocomplete="off" placeholder="Enter your table number" required aria-required="true">
			</div>
			<button id="checkout" type="button" data-i18n="placeOrder">Place Order</button>
		</section>
	</main>

	<script type="module" src="js/cart.js?v=18"></script>
</body>
</html>
