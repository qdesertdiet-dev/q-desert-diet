<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Categories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/admin.css?v=8">
</head>
<body>
  <aside>
    <h2>Business Admin</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="categories.html" class="active">Categories</a>
      <a href="items.html">Catalog Items</a>
      <a href="tables.html">Tables</a>
      <a href="whatsapp.html">WhatsApp</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>

  <main>
    <div class="page-header">
      <div>
        <p class="eyebrow">Catalog Setup</p>
        <h1>Category Management</h1>
      </div>
    </div>

    <div class="panel">
      <form id="category-form" class="admin-form">
        <input id="category-id" type="hidden">
        <div class="field-group">
          <label for="categoryName">Category name (English)</label>
          <input id="categoryName" placeholder="Enter your category name" required>
        </div>
        <div class="field-group">
          <label for="category-name-ar">Category name (Arabic)</label>
          <input id="category-name-ar" lang="ar" dir="rtl" placeholder="الاسم بالعربية">
        </div>
        <div class="form-actions">
          <button id="addCategory" class="primary-btn" type="submit">Add Category</button>
          <button id="reset-category" class="secondary-btn" type="reset">Reset</button>
        </div>
      </form>
      <p id="category-status" class="form-status" role="status" aria-live="polite"></p>
      <div id="categoryList" class="list-stack"></div>
    </div>
  </main>

  <script type="module" src="js/auth.js?v=12"></script>
  <script type="module" src="js/categories.js?v=3"></script>
</body>
</html>
