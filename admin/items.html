<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catalog Items</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/admin.css?v=8">
</head>
<body>
  <aside>
    <h2>Business Admin</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="categories.html">Categories</a>
      <a href="items.html" class="active">Catalog Items</a>
      <a href="tables.html">Tables</a>
      <a href="whatsapp.html">WhatsApp</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>

  <main>
    <div class="page-header">
      <div>
        <p class="eyebrow">Catalog Manager</p>
        <h1>Catalog Item Management</h1>
      </div>
    </div>

    <div class="panel-grid">
      <section class="panel">
        <h2>Add / Edit Item</h2>
        <form id="item-form" class="admin-form">
          <input id="item-id" type="hidden">
          <div class="field-group">
            <label for="item-name">Item name (English)</label>
            <input id="item-name" placeholder="Enter your item name" required>
          </div>
          <div class="field-group">
            <label for="item-name-ar">Item name (Arabic)</label>
            <input id="item-name-ar" lang="ar" dir="rtl" placeholder="اسم المنتج بالعربية">
          </div>
          <div class="field-group">
            <label for="item-description">Description (English)</label>
            <textarea id="item-description" rows="3" placeholder="Short product description"></textarea>
          </div>
          <div class="field-group">
            <label for="item-description-ar">Description (Arabic)</label>
            <textarea id="item-description-ar" rows="3" lang="ar" dir="rtl" placeholder="وصف المنتج بالعربية"></textarea>
          </div>
          <div class="field-group">
            <label for="item-category">Category (English)</label>
            <select id="item-category">
              <option value="">Select category</option>
            </select>
          </div>
          <div class="field-group">
            <label>Price</label>
            <input id="item-price" type="number" min="0" step="0.01" placeholder="150.00" required>
          </div>
          <div class="field-group">
            <label>Discount (%)</label>
            <input id="item-discount" type="number" min="0" max="100" step="1" placeholder="0">
          </div>
          <div class="field-group">
            <label>Images (1–3)</label>
            <input id="item-images" type="file" accept="image/*" multiple>
            <div id="image-previews" class="image-previews"></div>
          </div>
          <div class="field-group checkbox-field">
            <label for="item-popular">
              <input id="item-popular" type="checkbox">
              Show in Popular
            </label>
          </div>
          <p id="item-status" class="form-status" role="status" aria-live="polite"></p>
          <div class="form-actions">
            <button class="primary-btn" type="submit">Save Item</button>
            <button class="secondary-btn" id="reset-btn" type="button">Reset</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Existing Items</h2>
        <div id="items-list" class="item-list"></div>
      </section>
    </div>
  </main>

  <script type="module" src="js/auth.js?v=12"></script>
  <script type="module" src="js/items.js?v=13"></script>
</body>
</html>
